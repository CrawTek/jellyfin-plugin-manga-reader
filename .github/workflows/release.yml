name: Build and release
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test core behavior
        run: dotnet run --project tests/CoreTests.csproj -c Release
      - name: Test web shell middleware
        run: dotnet run --project middleware-tests/MiddlewareTests.csproj -c Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test reader and library integration
        run: |
          npm install
          npm test
      - name: Package
        shell: pwsh
        env:
          REPO: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $version = if ($env:REF_TYPE -eq 'tag') { $env:REF_NAME.TrimStart('v') } else { '0.4.0' }
          ./scripts/package.ps1 -Repository $env:REPO -Version $version
      - uses: actions/upload-artifact@v4
        with:
          name: manga-reader
          path: artifacts/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$env:TAG" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:TAG" artifacts/* --clobber
          } else {
            gh release create "$env:TAG" artifacts/* --title "Manga Reader $env:TAG" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }



